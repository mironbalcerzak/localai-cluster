# LocalAI cluster worker. Start:   docker compose up -d --build
#                         Logs:    docker compose logs -f
#                         Stop:    docker compose down
#                         Update:  docker compose build --pull && docker compose up -d
# Settings are in .env next to this file.
name: localai-worker

services:
  worker:
    build: .
    image: localai-worker:latest
    container_name: localai-worker
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "50050-50059:50050-50059"
    volumes:
      - models:/models       # copy of the models, sent by the server on first use
      - backends:/backends   # llama.cpp CUDA backend, downloaded on first use
      - staging:/staging
      - cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]

volumes:
  models:
  backends:
  staging:
  cache:
