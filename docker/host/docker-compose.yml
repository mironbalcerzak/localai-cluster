# LocalAI host: the server of the cluster. Started by ../../localai-cluster.sh host (or .bat).
#
#   proxy         :${LOCALAI_PORT} on the network (nginx). Passes a client's valid API key
#                 on and fills in the default key otherwise, so no key or login is needed.
#   idle-unloader unloads models after LOCALAI_IDLE_UNLOAD without requests.
#   frontend      API + web UI. Routes every request to a worker.
#   worker-local  the GPU of this PC, registered as a worker like any other.
#   postgres      users, API keys, node registry (required by distributed mode).
#   nats          message bus; remote workers connect to :4222.
#
# Other PCs join with ../../localai-cluster.sh worker (or .bat).
# Settings and secrets live in the .env next to the start scripts (created by the host).

name: ${COMPOSE_PROJECT_NAME:-localai}

configs:
  # nginx expands ${LOCALAI_API_KEY} from its environment when it starts; $$name are nginx variables.
  nginx-template:
    content: |
      map $$http_upgrade $$connection_upgrade { default upgrade; '' ''; }

      server {
        listen 8080;
        client_max_body_size 0;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Workers register and send heartbeats with their own token: pass them as they are.
        location /api/node/ {
          proxy_set_header Host $$host;
          proxy_pass http://frontend:8080;
        }

        # Everything else: first check the client's own key (a cheap GET /v1/models). A valid
        # key is passed on; no key or a rejected one (401) is replaced by the default key.
        location / {
          auth_request /_localai_key_check;
          error_page 401 = @default_key;
          proxy_set_header Host $$host;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_pass http://frontend:8080;
        }

        location = /_localai_key_check {
          internal;
          if ($$http_authorization = "") { return 401; }
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header Authorization $$http_authorization;
          proxy_pass http://frontend:8080/v1/models;
        }

        location @default_key {
          proxy_set_header Host $$host;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_set_header Authorization "Bearer ${LOCALAI_API_KEY}";
          proxy_pass http://frontend:8080;
        }
      }

  # LocalAI's own idle watchdog does not reach models loaded on workers, so this loop
  # unloads a model once none of its copies has had a request for LOCALAI_IDLE_UNLOAD.
  idle-unloader:
    content: |
      #!/bin/sh
      apk add --no-cache curl jq >/dev/null || exit 1
      case "$$IDLE" in
        *h) idle=$$(( $${IDLE%h} * 3600 ));;
        *m) idle=$$(( $${IDLE%m} * 60 ));;
        *s) idle=$${IDLE%s};;
        *)  idle=$$IDLE;;
      esac
      api="http://frontend:8080"
      auth="Authorization: Bearer $$LOCALAI_API_KEY"
      echo "idle-unloader: unloading models after $${idle}s without requests"
      while true; do
        curl -sf -m 10 -H "$$auth" "$$api/api/nodes/models" | jq -r --argjson now "$$(date +%s)" --argjson idle "$$idle" '
          group_by(.model_name)[]
          | select(all(.state == "loaded"))
          | select((map(.in_flight // 0) | add) == 0)
          | select($$now - (map((.last_used // .updated_at) | sub("\\.[0-9]+"; "") | fromdateiso8601) | max) > $$idle)
          | .[0].model_name' 2>/dev/null |
        while read -r model; do
          curl -sf -m 60 -H "$$auth" -H 'Content-Type: application/json' \
            -d "$$(jq -cn --arg m "$$model" '{model: $$m}')" "$$api/backend/shutdown" >/dev/null \
            && echo "idle-unloader: unloaded $$model"
        done
        sleep 15
      done

x-common-env: &common-env
  LOCALAI_NATS_URL: "nats://nats:4222"
  LOCALAI_REGISTRATION_TOKEN: "${LOCALAI_REGISTRATION_TOKEN:?start with localai-cluster.sh host / localai-cluster.bat host, which creates .env}"
  GODEBUG: "netdns=go"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: localai
      POSTGRES_USER: localai
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?}"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localai"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["--js", "-m", "8222"]
    ports:
      - "${LOCALAI_BIND:-0.0.0.0}:4222:4222"

  # Distributed mode refuses to run without auth, so auth stays on in the frontend and
  # this proxy fills in the API key when a client sends none or a rejected one.
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      LOCALAI_API_KEY: "${LOCALAI_API_KEY:?start with localai-cluster.sh host / localai-cluster.bat host, which creates .env}"
    configs:
      - source: nginx-template
        target: /etc/nginx/templates/default.conf.template
    ports:
      - "${LOCALAI_BIND:-0.0.0.0}:${LOCALAI_PORT:-23422}:8080"
    depends_on:
      frontend:
        condition: service_started

  idle-unloader:
    image: alpine:3
    restart: unless-stopped
    command: ["sh", "/idle-unloader.sh"]
    environment:
      LOCALAI_API_KEY: "${LOCALAI_API_KEY:?}"
      IDLE: "${LOCALAI_IDLE_UNLOAD:-2m}"
    configs:
      - source: idle-unloader
        target: /idle-unloader.sh
    depends_on:
      frontend:
        condition: service_started

  frontend:
    image: localai/localai:latest-gpu-nvidia-cuda-12
    restart: unless-stopped
    environment:
      <<: *common-env
      LOCALAI_DISTRIBUTED: "true"
      LOCALAI_AUTH: "true"
      LOCALAI_AUTH_DATABASE_URL: "postgresql://localai:${POSTGRES_PASSWORD}@postgres:5432/localai?sslmode=disable"
      # Workers must know the registration token, so approving them by hand adds nothing here.
      LOCALAI_AUTO_APPROVE_NODES: "true"
      # Models load on demand: none while idle, one copy on the first request, more PCs
      # only while all copies are busy (up to one copy per PC). idle-unloader unloads them.
      LOCALAI_MODEL_SCHEDULING: '[{"model_name":"${LOCALAI_MODEL:-gemma-4-12B-it-qat-UD-Q4_K_XL}","min_replicas":0,"max_replicas":64},{"model_name":"${LOCALAI_EMBEDDING_MODEL:-Qwen3-Embedding-8B-Q4_K_M.gguf}","min_replicas":0,"max_replicas":64}]'
      # Model staging to a fresh worker over Wi-Fi can be slow: let requests wait for it.
      LOCALAI_MODEL_LOAD_WAIT: "${LOCALAI_MODEL_LOAD_WAIT:-10m}"
      LOCALAI_NATS_MODEL_LOAD_TIMEOUT: "${LOCALAI_NATS_MODEL_LOAD_TIMEOUT:-}"
      LOCALAI_API_KEY: "${LOCALAI_API_KEY:?}"
      LOCALAI_ADMIN_EMAIL: "${LOCALAI_ADMIN_EMAIL:-}"
      # The first account becomes admin; later sign-ups wait for admin approval.
      LOCALAI_REGISTRATION_MODE: "${LOCALAI_REGISTRATION_MODE:-approval}"
      LOCALAI_VRAM_WARM_LIMIT: "0"
      # Hardware auto-tuning is on: LocalAI picks the parallel request slots per model from
      # the GPU's VRAM, and that wins over LLAMACPP_PARALLEL (only a fallback now). Set
      # LOCALAI_DISABLE_HARDWARE_DEFAULTS=true here to use LLAMACPP_PARALLEL instead.
      # Context for models whose YAML sets none (12k tokens), shared by the slots of a PC.
      LOCALAI_CONTEXT_SIZE: "${LOCALAI_CONTEXT_SIZE:-12288}"
      MODELS_PATH: /models
    volumes:
      - models:/models
      - configuration:/configuration
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  worker-local:
    image: localai/localai:latest-gpu-nvidia-cuda-12
    restart: unless-stopped
    init: true
    command: ["worker"]
    environment:
      <<: *common-env
      LOCALAI_REGISTER_TO: "http://frontend:8080"
      LOCALAI_NODE_NAME: "${LOCALAI_LOCAL_NODE_NAME:-server}"
      LOCALAI_SERVE_ADDR: "0.0.0.0:50051"
      LOCALAI_ADVERTISE_ADDR: "worker-local:50051"
      LOCALAI_ADVERTISE_HTTP_ADDR: "worker-local:50050"
      LOCALAI_NODE_LABELS: "gpu=nvidia"
      LLAMACPP_PARALLEL: "${LLAMACPP_PARALLEL:-5}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      MODELS_PATH: /models
      # Folders the entrypoint hands over to the unprivileged localai user.
      LOCALAI_DATA_DIRS: "/models /backends /staging /cache"
    volumes:
      - worker_models:/models
      - backends:/backends
      - worker_staging:/staging
      - worker_cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    depends_on:
      frontend:
        condition: service_started

volumes:
  postgres:
  models:
  configuration:
  data:
  backends:
  worker_models:
  worker_staging:
  worker_cache:
