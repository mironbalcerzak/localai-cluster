# LocalAI cluster worker. Started by ../../localai-cluster.sh worker (or .bat).
# Settings come from the .env next to the start scripts (created by the host).
name: localai-worker

services:
  worker:
    build: .
    image: localai-worker:latest
    container_name: localai-worker
    restart: unless-stopped
    init: true
    environment:
      LOCALAI_SERVER: "${LOCALAI_SERVER:?set LOCALAI_SERVER in .env}"
      LOCALAI_SERVER_PORT: "${LOCALAI_PORT:-23422}"
      LOCALAI_REGISTRATION_TOKEN: "${LOCALAI_REGISTRATION_TOKEN:?set LOCALAI_REGISTRATION_TOKEN in .env}"
      # The start scripts fill these in when they are empty in .env.
      WORKER_IP: "${WORKER_IP:?start with localai-cluster.sh worker / localai-cluster.bat worker, or set WORKER_IP in .env}"
      WORKER_NAME: "${WORKER_NAME:-}"
      LLAMACPP_PARALLEL: "${LLAMACPP_PARALLEL:-5}"
      # Same context as the host's (32k tokens), shared by the slots of this PC.
      LOCALAI_CONTEXT_SIZE: "${LOCALAI_CONTEXT_SIZE:-32768}"
      # The CUDA library (compute) and nvidia-smi (utility), as for the host's own worker.
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    ports:
      - "50050-50059:50050-50059"
    volumes:
      - models:/models       # copy of the host's models, kept current by the sync service
      - backends:/backends   # llama.cpp CUDA backend, downloaded on first use
      - staging:/staging
      - cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              # "compute" brings the CUDA library (libcuda.so.1), "utility" nvidia-smi. Docker
              # turns this list into NVIDIA_DRIVER_CAPABILITIES; with "utility" alone a
              # container sees the GPU in nvidia-smi but runs models on the CPU.
              capabilities: [gpu, compute, utility]

  # Keeps this PC's models the same as the host's, so loading one here needs no upload.
  sync:
    image: node:24-alpine
    container_name: localai-worker-sync
    restart: unless-stopped
    init: true
    command: ["node", "/app/sync.mjs"]
    environment:
      HOST_URL: "http://${LOCALAI_SERVER:?set LOCALAI_SERVER in .env}:${LOCALAI_PORT:-23422}"
      LOCALAI_REGISTRATION_TOKEN: "${LOCALAI_REGISTRATION_TOKEN:?set LOCALAI_REGISTRATION_TOKEN in .env}"
    volumes:
      - ./sync:/app:ro
      - models:/models

volumes:
  models:
  backends:
  staging:
  cache:
